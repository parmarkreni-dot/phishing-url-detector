<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phishing URL Detector</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#050816;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
repeating-linear-gradient(
90deg,
rgba(0,255,0,0.05) 0px,
rgba(0,255,0,0.05) 1px,
transparent 1px,
transparent 50px
);
animation:matrix 5s linear infinite;
}

@keyframes matrix{
from{
transform:translateY(-100%);
}
to{
transform:translateY(100%);
}
}

.container{
position:relative;
z-index:2;

width:700px;
max-width:95%;

padding:30px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

border-radius:20px;

box-shadow:0 0 25px #00ff99;
}

h1{
text-align:center;
margin-bottom:20px;
color:#00ff99;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;

border:none;
border-radius:10px;

background:#00ff99;

font-weight:bold;
font-size:16px;

cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.result{
margin-top:25px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.08);
display:none;
}

.result h2{
margin-bottom:15px;
}

ul{
margin-top:10px;
padding-left:20px;
}

li{
margin-bottom:8px;
}

.safe{
color:#00ff99;
}

.danger{
color:#ff4d4d;
}

.info{
margin-top:20px;
padding:15px;
border-radius:10px;
background:rgba(255,255,255,0.08);
}

.info h3{
margin-bottom:10px;
color:#00ff99;
}

</style>
</head>

<body>

<div class="container">

<h1>🎣 Phishing URL Detector</h1>

<input
type="text"
id="url"
placeholder="Enter Website URL">

<button onclick="scanURL()">
🔍 Scan URL
</button>

<div
id="result"
class="result">

<h2 id="status"></h2>

<h3 id="score"></h3>

<ul id="reasons"></ul>

<p id="recommendation"></p>

</div>

<div class="info">

<h3>What We Check</h3>

<p>✔ HTTPS Security</p>
<p>✔ Suspicious Keywords</p>
<p>✔ URL Length</p>
<p>✔ IP Address Usage</p>
<p>✔ Special Characters</p>

</div>

</div>

<script>

function scanURL(){

let url =
document.getElementById("url").value.trim();

let score = 0;

let reasons = [];

if(url===""){
alert("Please enter a URL");
return;
}

/* HTTP Check */

if(url.startsWith("http://")){
score++;
reasons.push(
"Uses HTTP instead of HTTPS"
);
}

/* @ Symbol */

if(url.includes("@")){
score++;
reasons.push(
"Contains @ symbol"
);
}

/* Long URL */

if(url.length > 50){
score++;
reasons.push(
"URL is unusually long"
);
}

/* Suspicious Keywords */

let keywords = [
"login",
"verify",
"bank",
"update",
"account",
"free-money"
];

for(let word of keywords){

if(url.toLowerCase().includes(word)){
score++;
reasons.push(
"Contains suspicious keyword: " + word
);
break;
}

}

/* IP Address Check */

let ipPattern =
/(\d{1,3}\.){3}\d{1,3}/;

if(ipPattern.test(url)){
score++;
reasons.push(
"Uses IP address instead of domain"
);
}

let status =
document.getElementById("status");

let scoreBox =
document.getElementById("score");

let reasonList =
document.getElementById("reasons");

let recommendation =
document.getElementById("recommendation");

document.getElementById(
"result").style.display =
"block";

reasonList.innerHTML = "";

reasons.forEach(function(item){

let li =
document.createElement("li");

li.innerText = item;

reasonList.appendChild(li);

});

scoreBox.innerHTML =
"Risk Score: " + score + "/5";

if(score <= 1){

status.innerHTML =
"✅ SAFE URL";

status.className =
"safe";

recommendation.innerHTML =
"Recommendation: Website appears safe. Always verify before entering personal information.";

}
else{

status.innerHTML =
"⚠️ SUSPICIOUS URL";

status.className =
"danger";

recommendation.innerHTML =
"Recommendation: Avoid opening or entering sensitive information on this website.";

}

}

</script>

</body>
</html>
